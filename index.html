<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf7f3">
<title>Cabas</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#fbf7f3;--card:#fff;--ink:#3b3431;--muted:#9a8f88;--line:#f0e8e2;--brand:#e5795c;--brand-ink:#fff;--soft:#fdeee8;--accent:#e8a33d;--accent-soft:#fdf3e1;--danger:#d9625a;--sh:0 1px 2px rgba(120,80,60,.05),0 8px 24px rgba(120,80,60,.07);--r:20px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1d1917;--card:#28221f;--ink:#efe7e2;--muted:#a69a92;--line:#3a322e;--brand:#f09479;--brand-ink:#2a1a14;--soft:#3c2a24;--accent:#f0b55c;--accent-soft:#3b3020;--danger:#f08177;--sh:none}}
:root[data-theme=dark]{--bg:#1d1917;--card:#28221f;--ink:#efe7e2;--muted:#a69a92;--line:#3a322e;--brand:#f09479;--brand-ink:#2a1a14;--soft:#3c2a24;--accent:#f0b55c;--accent-soft:#3b3020;--danger:#f08177;--sh:none}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand)}
svg{display:block}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 8px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.lt{display:flex;align-items:center;gap:6px;font-size:24px;font-weight:800;letter-spacing:-.02em;min-width:0}
.lt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt svg{width:20px;height:20px;color:var(--muted);flex:none}
.ha{display:flex;gap:4px}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;flex:none}
.ib svg{width:22px;height:22px}
.ib:active{background:var(--soft)}
.ib.on{background:var(--brand);color:var(--brand-ink)}
.ib.rec{background:var(--danger);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
main{max-width:640px;margin:0 auto;padding:0 16px}
.tab{display:none}.tab.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:14px 16px}
.mt{margin-top:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.h2{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:14px;font-weight:700;background:var(--soft);color:var(--brand);min-height:46px}
.btn svg{width:20px;height:20px}
.btn.pri{background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.danger{background:transparent;color:var(--danger)}
.btn.full{width:100%}
.btn.sm{padding:7px 12px;min-height:36px;font-size:14px;border-radius:11px}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 5px}

/* Résumé */
.sum{display:flex;gap:10px;align-items:stretch;margin:4px 0 10px}
.sum .k{flex:1;padding:10px 12px}
.sum .k b{display:block;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sum .k small{color:var(--muted);font-size:12px;font-weight:600}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:9px;transition:width .3s}
.bar.over i{background:var(--danger)}

/* Ajout */
.add{position:sticky;top:calc(62px + env(safe-area-inset-top));z-index:20;padding:6px 0 2px;background:var(--bg)}
.addrow{display:flex;gap:6px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:4px 4px 4px 14px;box-shadow:var(--sh)}
.addrow:focus-within{border-color:var(--brand)}
.addrow input{border:0;padding:10px 0;background:transparent}
.addrow .ib{width:40px;height:40px;color:var(--muted)}
.ac{position:absolute;left:0;right:0;top:100%;margin-top:4px;overflow:hidden;display:none;z-index:25}
.ac.on{display:block}
.ac button{display:flex;width:100%;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);text-align:left}
.ac button:first-child{border-top:0}
.ac em{font-style:normal;color:var(--muted);font-size:13px;margin-left:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.chip.due{border-color:var(--accent);background:var(--accent-soft)}
.chip:active{transform:scale(.97)}

/* Liste */
.gh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:16px 4px 7px}
.gh .dot{width:10px;height:10px;border-radius:4px;flex:none}
.gh .n{margin-left:auto;font-weight:700}
.items{overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-top:1px solid var(--line);min-height:58px}
.item:first-child{border-top:0}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:transparent;transition:.15s}
.chk svg{width:16px;height:16px}
.item.done .chk{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.item.done .in{text-decoration:line-through;color:var(--muted)}
.ibd{flex:1;min-width:0;text-align:left}
.in{font-weight:650;display:flex;align-items:center;gap:6px}
.in span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.isub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.qty{display:inline-block;background:var(--soft);color:var(--brand);font-weight:800;font-size:12px;padding:1px 8px;border-radius:999px;margin-right:4px}
.tag{flex:none;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--brand)}
.tag.warn{background:var(--accent-soft);color:var(--accent)}
.ip{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);text-align:right;flex:none}
.ip.est{font-style:italic;opacity:.8}
.ns{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;font-size:12px;font-weight:900;color:#fff;flex:none;text-transform:uppercase}
.ns-a{background:#038141}.ns-b{background:#85bb2f}.ns-c{background:#e6b800}.ns-d{background:#ee8100}.ns-e{background:#e63e11}
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty .big{font-size:56px;line-height:1;margin-bottom:12px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.donebar{display:flex;align-items:center;justify-content:space-between;margin:18px 4px 8px;color:var(--muted);font-weight:700;font-size:14px}
.finish{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));margin-top:14px;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.18)}
body.store .item{min-height:70px;padding:14px 14px 14px 16px}
body.store .in{font-size:19px}
body.store .chk{width:34px;height:34px}
body.store .chips{display:none}

/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:700;color:var(--muted);border-radius:12px}
.nav svg{width:24px;height:24px}
.nav button.on{color:var(--brand)}
.nav button.on svg{transform:translateY(-1px)}

/* Feuille */
.sw{position:fixed;inset:0;z-index:60;pointer-events:none}
.sw .bd{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:90vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sw.on{pointer-events:auto}
.sw.on .bd{opacity:1}
.sw.on .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:4px 0 4px;font-size:20px;letter-spacing:-.01em}
.acts{display:flex;gap:10px;margin-top:18px}
.acts>*{flex:1}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:80;background:var(--ink);color:var(--bg);padding:11px 14px 11px 16px;border-radius:14px;display:flex;align-items:center;gap:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--brand);font-weight:800;filter:brightness(1.4)}

/* Magasins */
#map{height:240px;border-radius:var(--r);overflow:hidden;margin-top:12px;z-index:0;border:1px solid var(--line)}
.st{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:flex-start}
.st:first-child{border-top:0}
.st .lg{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:16px;color:#fff;flex:none}
.st .bd2{flex:1;min-width:0}
.st b{display:block}
.st .meta{font-size:13px;color:var(--muted);margin-top:2px}
.st .sa{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.star{color:var(--line)}.star.on{color:#f2b705}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--brand);color:var(--brand-ink)}

/* Prix */
.pr{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.pr:first-child{border-top:0}
.pr .bd2{flex:1;min-width:0}
.pr .v{text-align:right;font-variant-numeric:tabular-nums}
.pr .v b{display:block}
.up{color:var(--danger)}.down{color:var(--brand)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tr.best td{color:var(--brand);font-weight:700}

/* Conseils */
.tip{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.tip:first-child{border-top:0}
.tip .e{font-size:22px;line-height:1.2;flex:none}
.tip p{margin:0}
.res{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--soft);color:var(--brand);font-weight:700}

/* Plus */
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.li:first-child{border-top:0}
.li .bd2{flex:1;min-width:0}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none}
.radio.on{border:6px solid var(--brand)}
.ord{display:flex;align-items:center;gap:10px;padding:8px 10px;border-top:1px solid var(--line)}
.ord:first-child{border-top:0}
.ord span{flex:1}
.ord .ib{width:38px;height:38px}

/* Scan */
.cam{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:4/3;margin-top:8px}
.cam video{width:100%;height:100%;object-fit:cover}
.cam::after{content:"";position:absolute;left:12%;right:12%;top:42%;height:16%;border:3px solid rgba(255,255,255,.85);border-radius:12px}
.offp{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.offp img{width:44px;height:44px;object-fit:contain;border-radius:8px;background:#fff;flex:none}
.spark{width:100%;height:60px;margin-top:8px}

/* v1.1 */
.syncb{position:relative}
.syncb::after{content:"";position:absolute;right:8px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--muted);border:2px solid var(--bg)}
.syncb.ok::after{background:var(--brand)}
.syncb.busy::after{background:var(--accent)}
.syncb.err::after{background:var(--danger)}
.shbar{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 14px;margin-bottom:8px}
.shbar .bd2{flex:1;min-width:0}
.shbar .bd2 div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log{padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.log:first-child{border-top:0}
.log.msg{background:var(--soft)}
.log time{float:right;color:var(--muted);font-size:12px;margin-left:8px}
.code{font:800 30px/1 ui-monospace,Menlo,monospace;letter-spacing:.18em;text-align:center;padding:16px;border-radius:14px;background:var(--soft);color:var(--brand);margin-top:12px}
.finP::placeholder{color:var(--muted);opacity:.75;font-style:italic}
pre.gs{white-space:pre-wrap;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;max-height:30vh;overflow:auto}

/* Présentation épurée : sections douces, toucher pour rayer */
.lt{font-weight:750;color:var(--ink)}
.sum .k{border:0;box-shadow:var(--sh)}
.sum .k b{font-weight:700}
.addrow{border-color:transparent;box-shadow:var(--sh);border-radius:18px}
.card{border-color:transparent}
.nav{border-top:0;box-shadow:0 -6px 20px rgba(120,80,60,.06)}
.toast{background:#4a3f3a;color:#fff}
.sec{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-top:14px}
.cgh{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:15px;font-weight:700;color:var(--ink);letter-spacing:.01em}
.cgh .e{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:rgba(255,255,255,.65)}
.cgh .n{margin-left:auto;font-size:13px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.6);border-radius:999px;padding:1px 9px}
.citem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:54px;padding:10px 18px;border-top:1px solid var(--line);font-size:18px;font-weight:500;color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:opacity .25s,background .15s}
.citem:active{background:var(--soft)}
.citem .q{font-size:14px;font-weight:600;color:var(--brand);background:var(--soft);border-radius:999px;padding:2px 9px;white-space:nowrap}
.citem .nt{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:35%}
.citem .nm{flex:1;min-width:0;position:relative;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citem .nm::after{content:"";position:absolute;left:0;top:50%;height:2px;width:0;background:var(--brand);border-radius:2px;transition:width .22s ease}
.citem.gone .nm::after{width:100%}
.citem.gone{opacity:.35}
.citem .pz{font-size:14px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.citem .tg{font-size:14px;white-space:nowrap}
.chint{font-size:13px;color:var(--muted);text-align:center;margin:14px 0 0}
.upd{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:90;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--card);box-shadow:0 10px 30px rgba(0,0,0,.18);max-width:616px;margin:0 auto;font-weight:600}
.upd span{flex:1}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .cgh .e,:root:not([data-theme=light]) .cgh .n{background:rgba(0,0,0,.25)}}
:root[data-theme=dark] .cgh .e,:root[data-theme=dark] .cgh .n{background:rgba(0,0,0,.25)}
.trip{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;margin:4px 0 12px;border:2px solid var(--soft)}
.trow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.trow+.trow{margin-top:8px}
.tstore{font-weight:700;text-align:left;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttot{text-align:left}
.ttot small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.ttot b{font-size:28px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--brand)}
.cam.lbl{aspect-ratio:3/2}
.cam.lbl::after{left:4%;right:4%;top:15%;height:70%}
body.store .citem{min-height:62px;font-size:20px}
</style>
</head>
<body>
<header class="top">
  <button id="titleBtn" class="lt"><span id="title">Courses</span><svg id="titleChev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
  <div class="ha" id="listActs">
    <button id="syncBtn" class="ib syncb"></button>
    <button id="storeBtn" class="ib"></button>
    <button id="shareBtn" class="ib"></button>
  </div>
</header>

<main>
  <section id="tab-list" class="tab on">
    <div id="tripbar"></div>
    <div id="sum"></div>
    <div id="shbar"></div>
    <div class="add">
      <div style="position:relative">
        <div class="addrow">
          <input id="addIn" autocomplete="off" autocapitalize="sentences" enterkeyhint="done">
          <button id="micBtn" class="ib"></button>
          <button id="scanBtn" class="ib"></button>
        </div>
        <div id="ac" class="ac card"></div>
      </div>
      <div id="chips" class="chips"></div>
    </div>
    <div id="list"></div>
  </section>
  <section id="tab-stores" class="tab"></section>
  <section id="tab-prices" class="tab"></section>
  <section id="tab-tips" class="tab"></section>
  <section id="tab-more" class="tab"></section>
</main>

<nav class="nav" id="nav">
  <button data-tab="list" class="on"></button>
  <button data-tab="stores"></button>
  <button data-tab="prices"></button>
  <button data-tab="tips"></button>
  <button data-tab="more"></button>
</nav>

<div id="sw" class="sw"><div class="bd" id="bd"></div><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<script>
'use strict';
const APP_VERSION = '1.5.0';
const KEY = 'cabas.v1';

/* ================= Traductions ================= */
const T = {
fr:{
  tab_list:'Liste', tab_stores:'Magasins', tab_prices:'Prix', tab_tips:'Conseils', tab_more:'Plus',
  add_ph:'Ajouter…  ex. 2 kg tomates', a_store:'Mode courses', a_send:'Envoyer la liste', a_sync:'Partage en direct', a_mic:'Dicter', a_scan:'Scanner un code-barres',
  s_todo:'À prendre', s_est:'Estimation', s_basket:'Dans le panier', budget:'Budget',

function norm(s){ return String(s||'').toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/['’\-]/g,' ').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
const keyOf = name => norm(name).split(' ').map(w => w.length > 3 && /[sx]$/.test(w) ? w.slice(0,-1) : w).join(' ');

/* ================= Logique métier ================= */
function guessRayon(name, cats){
  const k = canonK(name);
  if (S.catalog[k]?.rayon) return S.catalog[k].rayon;
  const sd = SEEDK[keyOf(name)]; if (sd) return sd.r;
  if (cats && cats.length) for (let i = cats.length - 1; i >= 0; i--) if (OFF_CAT[cats[i]]) return OFF_CAT[cats[i]];
  const n = ' ' + norm(name) + ' ';
  let best = null, len = 0;
  for (const {kw, r} of KWN) if (kw.length > len && n.includes(' ' + kw)) { best = r; len = kw.length; }
  return best || 'aut';
}
function seasonOf(name){
  const n = ' ' + keyOf(name) + ' ';
  let best = null, len = 0;
  for (const {k, v} of SEASONN){
    if (k.length <= len) continue;
    if (n.includes(' ' + k + ' ') || (k.length > 4 && n.includes(' ' + k))){ best = v; len = k.length; }
  }
  return best;
}
function inSeason(name){ const s = seasonOf(name); return s ? s.m.includes(new Date().getMonth() + 1) : null; }

function parseInput(txt){
  txt = txt.trim().replace(/\s+/g, ' ');
  let qty = null, unit = '', name = txt, m;
  if ((m = txt.match(/^(\d+(?:[.,]\d+)?)\s*(kg|g|gr|l|cl|ml|x)?\.?\s+(?:de\s+|d['’]\s*)?(.+)$/i))){ qty = num(m[1]); unit = (m[2] || '').toLowerCase(); name = m[3]; }
  else if ((m = txt.match(/^(.+?)\s*(?:x|×)\s*(\d+)$/i))){ name = m[1]; qty = num(m[2]); }
  if (unit === 'gr') unit = 'g';
  if (unit === 'x') unit = '';
  return {name: cap(name.trim()), qty, unit};
}
function toBase(qty, unit){
  const q = qty || 1;
  switch(unit){
    case 'kg': return {v:q, u:'kg'}; case 'g': return {v:q/1000, u:'kg'};
    case 'l': return {v:q, u:'L'}; case 'cl': return {v:q/100, u:'L'}; case 'ml': return {v:q/1000, u:'L'};
    default: return {v:q, u:'pce'};
  }
}
const unitPrice = (p, qty, unit) => { const b = toBase(qty, unit); return {up: p / b.v, uu: b.u}; };
const fmtUnit = (up, uu) => up == null ? '' : eur(up) + (uu === 'pce' ? (LANG === 'es' ? '/ud' : '/pce') : '/' + uu);
const qtyLabel = it => it.qty ? (it.unit ? `${String(it.qty).replace('.', ',')} ${it.unit}` : `×${String(it.qty).replace('.', ',')}`) : '';

function recordsOf(k){ return S.prices.filter(r => r.k === k).sort((a, b) => b.d.localeCompare(a.d)); }
function lastPrice(k, chain){ return recordsOf(k).find(r => !chain || r.c === chain) || null; }
function suggestPrice(it, chain){
  const r = lastPrice(it.k, chain); if (!r) return null;
  const b = toBase(it.qty, it.unit);
  return r.uu === b.u ? r.up * b.v : r.p;
}
function estPrice(it){
  if (it.price != null) return {v: it.price, est:false};
  const v = suggestPrice(it); return v == null ? null : {v, est:true};
}
function learn(name, patch){
  const k = canonK(name);
  const c = S.catalog[k] || (S.catalog[k] = {name, rayon:null, n:0, b:0});
  c.name = c.name || name;
  Object.assign(c, patch || {});
  return c;
}

/* --- Modifications suivies (pour le partage en direct) --- */
function touch(L, it){ it.u = Date.now(); it.by = S.dev; if (L.shared){ it.dirty = it.u; queueSync(); } }
function removeItem(L, it){
  const i = L.items.indexOf(it); if (i >= 0) L.items.splice(i, 1);
  if (L.shared){ L.gone.push({id:it.id, u:Date.now(), del:true, dirty:1}); if (L.gone.length > 300) L.gone.splice(0, L.gone.length - 300); queueSync(); }
}
function logEv(L, k, x){ if (!L.shared) return; (L.outLog = L.outLog || []).push({id:uid(), t:Date.now(), by:S.dev, w:S.settings.me || '', k, x}); queueSync(); }

function addItem(text, extra = {}){
  const L = curList();
  const p = extra.name ? {name: extra.name, qty: extra.qty ?? null, unit: extra.unit || ''} : parseInput(text);
  if (!p.name) return;
  const k = canonK(p.name);
  const ex = L.items.find(i => i.k === k && !i.checked);
  if (ex){
    if (!ex.unit && !p.unit) ex.qty = (ex.qty || 1) + (p.qty || 1);
    else if (p.qty) { ex.qty = p.qty; ex.unit = p.unit; }
    touch(L, ex); save(); renderList(); toast(t('qty_upd', {x: dn(ex)}));
    return ex;
  }
  const cat = S.catalog[k];
  const it = {
    id:uid(), name:p.name, k, qty:p.qty, unit:p.unit,
    rayon: extra.rayon || guessRayon(p.name, extra.cats),
    note:'', checked:false, price:null,
    code: extra.code || cat?.code || null, brand: extra.brand || cat?.brand || '', ns: extra.ns || cat?.ns || null, ts: Date.now()
  };
  L.items.push(it); touch(L, it); logEv(L, 'add', it.name);
  learn(p.name, {n:(cat?.n || 0) + 1, last: today(), code: it.code, brand: it.brand, ns: it.ns});
  save(); renderList(); vib(8);
  return it;
}

function reminders(){
  const inList = new Set(curList().items.map(i => i.k));
  const byK = {};
  S.history.forEach(h => h.items.forEach(i => { (byK[i.k] = byK[i.k] || {name:i.n, d:new Set()}).d.add(h.d); }));
  const out = [];
  for (const k in byK){
    if (inList.has(k)) continue;
    const ds = [...byK[k].d].sort();
    if (ds.length < 3) continue;
    let sum = 0; for (let i = 1; i < ds.length; i++) sum += daysBetween(ds[i-1], ds[i]);
    const avg = sum / (ds.length - 1), since = daysBetween(ds[ds.length - 1], today());
    if (avg >= 2 && since >= avg * 0.9) out.push({k, name: byK[k].name, avg: Math.round(avg), since, r: since / avg});
  }
  return out.sort((a, b) => b.r - a.r);
}
function frequent(){
  const inList = new Set(curList().items.map(i => i.k));
  return Object.entries(S.catalog).filter(([k]) => !inList.has(k))
    .sort((a, b) => (b[1].b * 3 + b[1].n) - (a[1].b * 3 + a[1].n)).slice(0, 12).map(([k, c]) => ({k, name:c.name}));
}

function storeAnalysis(items){
  const chains = [...new Set(S.prices.map(r => r.c))];
  if (!chains.length) return null;
  const rows = items.map(it => {
    const b = toBase(it.qty, it.unit); const per = {};
    chains.forEach(c => { const r = lastPrice(it.k, c); if (r && r.uu === b.u) per[c] = r.up; });
    const vals = Object.values(per);
    return {it, b, per, min: vals.length ? Math.min(...vals) : null};
  });
  const stats = chains.map(c => {
    let cov = 0, ratio = 0;
    rows.forEach(r => { if (r.per[c] != null){ cov++; ratio += r.per[c] / r.min; } });
    return {c, cov, idx: cov ? ratio / cov : null};
  }).filter(s => s.cov > 0);
  if (!stats.length) return null;
  const maxCov = Math.max(...stats.map(s => s.cov));
  const elig = stats.filter(s => s.cov >= Math.max(1, Math.ceil(maxCov * 0.5))).sort((a, b) => a.idx - b.idx);
  const best = elig[0];
  let saving = 0; const moves = [];
  rows.forEach(r => {
    const pb = r.per[best.c];
    if (pb == null || r.min == null || r.min >= pb * 0.97) return;
    const cheap = Object.entries(r.per).find(([, v]) => v === r.min)[0];
    const s = (pb - r.min) * r.b.v; saving += s;
    moves.push({name:dn(r.it), cheap, s, pb, pm:r.min, uu:r.b.u});
  });
  return {stats: stats.sort((a, b) => b.cov - a.cov || a.idx - b.idx), best, saving, moves: moves.sort((a, b) => b.s - a.s), n: items.length};
}

function takeItem(L, it){
  const idx = L.items.indexOf(it);
  removeItem(L, it); logEv(L, 'chk', it.name);
  const d = today();
  let hst = S.history.find(x => x.auto && x.d === d);
  if (!hst){ hst = {id:uid(), d, s:'', c:'', items:[], t:0, auto:true}; S.history.push(hst); }
  const fresh = !hst.items.some(x => x.k === it.k);
  if (fresh) hst.items.push({n:it.name, k:it.k, q:it.qty, u:it.unit, p:null});
  const cat = learn(it.name); if (fresh){ cat.b = (cat.b || 0) + 1; cat.lb = d; } if (!cat.rayon) cat.rayon = it.rayon;
  S.recent = [{k:it.k, name:it.name, qty:it.qty, unit:it.unit, rayon:it.rayon, t:Date.now()}, ...(S.recent || []).filter(r => r.k !== it.k)].slice(0, 24);
  save(); renderList();
  toast(t('took', {x:dn(it)}), () => {
    L.items.splice(Math.min(idx, L.items.length), 0, it);
    L.gone = L.gone.filter(g => g.id !== it.id);
    if (fresh){ hst.items = hst.items.filter(x => x.k !== it.k); cat.b = Math.max(0, (cat.b || 1) - 1); }
    S.recent = S.recent.filter(r => r.k !== it.k);
    touch(L, it); save(); renderList();
  });
}

/* ================= Feuilles & toasts ================= */
let sheetOpen = false, onSheetClose = null;
function openSheet(html, onClose){
  $('#sheet').innerHTML = '<div class="grab"></div>' + html;
  $('#sheet').scrollTop = 0;
  if (!sheetOpen) history.pushState({sheet:1}, '');
  sheetOpen = true; onSheetClose = onClose || null;
  $('#sw').classList.add('on');
  return $('#sheet');
}
function closeSheet(fromPop){
  if (!sheetOpen) return;
  sheetOpen = false;
  $('#sw').classList.remove('on');
  if (onSheetClose){ const f = onSheetClose; onSheetClose = null; f(); }
  if (!fromPop && history.state && history.state.sheet) history.back();
}
window.addEventListener('popstate', () => { if (sheetOpen) closeSheet(true); });
$('#bd').onclick = () => closeSheet();
let toastT;
function toast(msg, undo){
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button>${t('undo')}</button>` : ''}`;
  el.classList.add('on');
  if (undo) el.querySelector('button').onclick = () => { undo(); el.classList.remove('on'); };
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), undo ? 5000 : 3000);
}

/* ================= Open Food Facts / Open Prices ================= */
async function offProduct(code){
  const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=code,product_name,product_name_fr,product_name_es,generic_name,brands,nutriscore_grade,quantity,categories_tags`);
  const j = await r.json();
  if (j.status !== 1 || !j.product) return null;
  const p = j.product;
  const ns = /^[a-e]$/.test(p.nutriscore_grade || '') ? p.nutriscore_grade : null;
  const name = LANG === 'es' ? (p.product_name_es || p.product_name || p.product_name_fr) : (p.product_name_fr || p.product_name || p.product_name_es);
  return {code, name: name || p.generic_name || '', brands:(p.brands || '').split(',')[0].trim(), ns, cats:p.categories_tags || []};
}
async function offSearch(q, box, onPick){
  box.innerHTML = `<p class="small muted">${t('searching')}</p>`;
  try {
    const u = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=12&fields=code,product_name,product_name_fr,product_name_es,brands,nutriscore_grade,image_front_small_url,quantity&tagtype_0=countries&tag_contains_0=contains&tag_0=spain`;
    const j = await (await fetch(u)).json();
    const ps = (j.products || []).filter(p => p.code);
    if (!ps.length){ box.innerHTML = `<p class="small muted">${t('off_none')}</p>`; return; }
    const pn = p => (LANG === 'es' ? (p.product_name_es || p.product_name || p.product_name_fr) : (p.product_name_fr || p.product_name || p.product_name_es)) || '—';
    box.innerHTML = `<p class="small muted" style="margin:10px 0 2px">${t('off_pick')}</p>` + ps.map((p, i) => {
      const ns = /^[a-e]$/.test(p.nutriscore_grade || '') ? p.nutriscore_grade : null;
      return `<button class="offp" data-i="${i}">${p.image_front_small_url ? `<img src="${esc(p.image_front_small_url)}" alt="" loading="lazy">` : '<span style="width:44px"></span>'}<div style="flex:1;min-width:0"><b style="display:block">${esc(pn(p))}</b><span class="small muted">${esc((p.brands || '').split(',')[0])} ${esc(p.quantity || '')}</span></div>${ns ? `<i class="ns ns-${ns}">${ns}</i>` : ''}</button>`;
    }).join('');
    $$('.offp', box).forEach(b => b.onclick = () => { const p = ps[+b.dataset.i]; onPick({code:p.code, brands:(p.brands || '').split(',')[0].trim(), ns: /^[a-e]$/.test(p.nutriscore_grade || '') ? p.nutriscore_grade : null}); });
  } catch(e){ box.innerHTML = `<p class="small muted">${t('off_down')}</p>`; }
}
async function openPrices(code, box){
  box.innerHTML = `<p class="small muted">${t('loading')}</p>`;
  try {
    const j = await (await fetch(`https://prices.openfoodfacts.org/api/v1/prices?product_code=${encodeURIComponent(code)}&order_by=-date&size=40`)).json();
    const items = (j.items || []).filter(p => p.currency === 'EUR');
    if (!items.length){ box.innerHTML = `<p class="small muted">${t('op_none')}</p>`; return; }
    const isES = p => /espa|spain/i.test(p.location?.osm_address_country || '') ? 1 : 0;
    items.sort((a, b) => isES(b) - isES(a));
    box.innerHTML = `<table class="mt"><tr><th>${t('th_place')}</th><th style="text-align:right">${t('th_price')}</th></tr>${items.slice(0, 12).map(p => `<tr><td>${esc(p.location?.osm_name || '—')}<div class="small muted">${esc([p.location?.osm_address_city, p.location?.osm_address_country].filter(Boolean).join(', '))} · ${fdate(p.date)}</div></td><td class="n">${eur(p.price)}</td></tr>`).join('')}</table><p class="small muted">${t('op_src')}</p>`;
  } catch(e){ box.innerHTML = `<p class="small muted">${t('op_down')}</p>`; }
}

let scanStream = null, scanLoop = null;
function stopScan(){ if (scanLoop) cancelAnimationFrame(scanLoop); scanLoop = null; if (scanStream) scanStream.getTracks().forEach(x => x.stop()); scanStream = null; }
async function addByCode(code){

  if (p && p.name){ addItem('', {name: cap(p.name), code, brand:p.brands, ns:p.ns, cats:p.cats}); toast(t('added', {x:p.name})); }
  else { const it = addItem('', {name:`${t('product')} ${code}`, code}); toast(t('unknown_prod')); if (it) setTimeout(() => editItem(it.id), 300); }

async function openScan(){
  const has = 'BarcodeDetector' in window;
  const sh = openSheet(`<h3>${t('scan_t')}</h3>
    ${has ? `<div class="cam"><video id="vid" playsinline muted></video></div><p class="small muted">${t('scan_aim')}</p>` : `<p class="small muted">${t('scan_nosup')}</p>`}
    <div class="row mt"><input id="codeIn" inputmode="numeric" placeholder="${t('scan_ph')}"><button class="btn pri" id="codeOk" style="flex:none">${t('ok')}</button></div>`, stopScan);
  sh.querySelector('#codeOk').onclick = () => { const c = $('#codeIn').value.replace(/\D/g, ''); if (c.length >= 8){ closeSheet(); addByCode(c); } };
  if (!has) return;
  try {
    const det = new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
    scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v = $('#vid'); v.srcObject = scanStream; await v.play();
    let last = 0;
    const tick = async ts => {
      if (!scanStream) return;
      if (ts - last > 250){
        last = ts;
        try { const r = await det.detect(v); if (r.length){ vib([30, 40, 30]); const c = r[0].rawValue; closeSheet(); addByCode(c); return; } } catch(e){}
      }
      scanLoop = requestAnimationFrame(tick);
    };
    scanLoop = requestAnimationFrame(tick);
  } catch(e){ toast(t('cam_err')); }
}

/* ================= Terminer les courses ================= */
function storeLabel(s){ const b = s.brand, n = s.name; if (b && n && !norm(n).includes(norm(b))) return `${b} · ${n}`; return n || b || t('store'); }
function chainOf(s){ return s.brand || s.name || t('store'); }
function knownStores(){
  const m = new Map();
  S.favStores.forEach(s => m.set(s.id, s));
  (S.storesCache?.list || []).slice(0, 10).forEach(s => { if (!m.has(s.id)) m.set(s.id, s); });
  return [...m.values()];
}
function openFinish(){
  const L = curList(); const done = L.items.filter(i => i.checked);
  const stores = knownStores();
  const pastChains = [...new Set(S.history.map(h => h.c).filter(Boolean))];
  const opts = stores.map(s => `<option value="id:${s.id}">${esc(storeLabel(s))}${s.dist ? ' — ' + fmtDist(s.dist) : ''}</option>`).join('')
    + pastChains.filter(c => !stores.some(s => chainOf(s) === c)).map(c => `<option value="c:${esc(c)}">${esc(c)}</option>`).join('')
    + `<option value="other">${t('other_store')}</option>`;
  const sh = openSheet(`<h3>${t('finish')}</h3>
    <p class="small muted" style="margin:2px 0 0">${t('fin_d')}</p>
    <label class="f">${t('store')}</label><select id="finStore">${opts}</select>
    <input id="finOther" class="mt" placeholder="${t('fin_ph')}" style="display:none">
    <div class="h2">${t('paid')}</div>
    <p class="small muted" id="sugHint" style="margin:-4px 4px 8px;display:none">${t('sug_hint')}</p>
    <div class="card">${done.map(it => `<div class="item"><div class="ibd"><div class="in"><span>${esc(dn(it))}</span></div>${qtyLabel(it) ? `<div class="isub">${esc(qtyLabel(it))}</div>` : ''}</div><input class="finP" data-id="${it.id}" inputmode="decimal" placeholder="€" style="width:100px;flex:none;text-align:right" value="${it.price ?? ''}"></div>`).join('')}</div>
    <button class="btn sm mt" id="sugAll" style="display:none">${t('sug_all')}</button>
    <div class="row mt" style="justify-content:space-between"><b>${t('total')}</b><b id="finTot" style="text-align:right">—</b></div>
    <div class="acts"><button class="btn ghost" id="finCancel">${t('cancel')}</button><button class="btn pri" id="finOk">${t('save')}</button></div>`);
  const sel = sh.querySelector('#finStore');
  const currentChain = () => { const v = sel.value; if (v === 'other') return $('#finOther').value.trim(); if (v.startsWith('c:')) return v.slice(2); const s = stores.find(x => 'id:' + x.id === v); return s ? chainOf(s) : ''; };
  const total = () => { let x = 0; $$('.finP', sh).forEach(i => { const v = num(i.value); if (v != null) x += v; }); $('#finTot').textContent = x ? eur(x) : '—'; };
  const suggest = () => {
    const c = currentChain(); let any = false;
    $$('.finP', sh).forEach(inp => {
      const it = done.find(i => i.id === inp.dataset.id);
      const v = c ? suggestPrice(it, c) : null;
      if (v != null){ inp.dataset.sug = v.toFixed(2); inp.placeholder = '≈ ' + v.toFixed(2).replace('.', LANG === 'es' || LANG === 'fr' ? ',' : '.'); if (!inp.value) any = true; }
      else { delete inp.dataset.sug; inp.placeholder = '€'; }
    });
    $('#sugHint').style.display = any ? '' : 'none';
    $('#sugAll').style.display = any ? '' : 'none';
    total();
  };
  $$('.finP', sh).forEach(i => {
    i.oninput = total;
    i.onfocus = () => { if (!i.value && i.dataset.sug){ i.value = i.dataset.sug; total(); setTimeout(() => i.select(), 0); } };
  });
  sh.querySelector('#sugAll').onclick = () => { $$('.finP', sh).forEach(i => { if (!i.value && i.dataset.sug) i.value = i.dataset.sug; }); suggest(); };
  sel.onchange = () => { $('#finOther').style.display = sel.value === 'other' ? '' : 'none'; suggest(); };
  $('#finOther').oninput = suggest;
  sel.value = stores.length ? 'id:' + stores[0].id : (pastChains.length ? 'c:' + pastChains[0] : 'other');
  sel.onchange();
  sh.querySelector('#finCancel').onclick = () => closeSheet();
  sh.querySelector('#finOk').onclick = () => {
    const v = sel.value; let s = '', c = '';
    if (v === 'other'){ s = c = $('#finOther').value.trim(); if (!s) return toast(t('need_store')); }
    else if (v.startsWith('c:')){ s = c = v.slice(2); }
    else { const st = stores.find(x => 'id:' + x.id === v); s = storeLabel(st); c = chainOf(st); }
    const d = today(); const hist = {id:uid(), d, s, c, items:[], t:0};
    $$('.finP', sh).forEach(inp => {
      const it = done.find(i => i.id === inp.dataset.id); const p = num(inp.value);
      hist.items.push({n:it.name, k:it.k, q:it.qty, u:it.unit, p});
      if (p != null){
        hist.t += p;
        const {up, uu} = unitPrice(p, it.qty, it.unit);
        S.prices.push({k:it.k, n:it.name, s, c, p, q:it.qty, u:it.unit, up, uu, d});
      }
      const cat = learn(it.name); cat.b = (cat.b || 0) + 1; cat.lb = d; if (!cat.rayon) cat.rayon = it.rayon;
    });
    S.history.push(hist);
    done.forEach(it => removeItem(L, it));
    logEv(L, 'done', c);
    if (S.settings.storeMode) setStoreMode(false);
    save(); renderList(); closeSheet(); vib([20, 50, 20]);
    toast(t('fin_ok') + (hist.t ? ' · ' + eur(hist.t) : ''));
  };
}

let map = null;
const BRAND_COL = {mercadona:'#1b8a46', lidl:'#0050aa', carrefour:'#1e5bc6', dia:'#e30613', alcampo:'#e2001a', eroski:'#d6001c', aldi:'#00205b', simply:'#e30613', 'el corte ingles':'#007a3d', hipercor:'#007a3d', consum:'#f18a00', bm:'#e5007d', ahorramas:'#00843d', supeco:'#ffb400', masymas:'#d7141a'};
const brandColor = n => { const k = norm(n); for (const b in BRAND_COL) if (k.includes(b)) return BRAND_COL[b]; let h = 0; for (const ch of k) h = (h * 31 + ch.charCodeAt(0)) % 360; return `hsl(${h} 45% 45%)`; };
const fmtDist = m => m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1).replace('.', ',')} km`;
function hav(a, b, c, d){ const R = 6371000, r = Math.PI / 180; const x = Math.sin((c - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin((d - b) * r / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); }
function renderStores(){
  const st = S.settings; const c = S.storesCache;
  const favIds = new Set(S.favStores.map(s => s.id));
  const listHtml = arr => arr.map(s => {
    const lab = storeLabel(s); const ch = chainOf(s);
    const known = S.prices.filter(r => r.c === ch).length;
    const walk = s.dist ? Math.max(1, Math.round(s.dist / 80)) : null;
    const car = s.dist ? Math.max(2, Math.round(s.dist * 1.4 / 420) + 2) : null;
    return `<div class="st" data-sid="${s.id}"><div class="lg" style="background:${brandColor(ch)}">${esc(ch.slice(0, 2).toUpperCase())}</div>
      <div class="bd2"><b>${esc(lab)}</b><div class="meta">${s.dist != null ? `${fmtDist(s.dist)} · 🚶 ${walk} min · 🚗 ~${car} min` : ''}${s.addr ? `<br>${esc(s.addr)}` : ''}${s.hours ? `<br>🕒 ${esc(s.hours.length > 48 ? s.hours.slice(0, 48) + '…' : s.hours)}` : ''}${known ? `<br>📈 ${t('known_prices', {n:known, c:esc(ch)})}` : ''}</div>
      <div class="sa"><a class="btn sm" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}&travelmode=walking" target="_blank" rel="noopener">${ic('route')} ${t('route')}</a></div></div>
      <button class="ib star ${favIds.has(s.id) ? 'on' : ''}" data-fav="${s.id}" aria-label="★">${ic('star')}</button></div>`;
  }).join('');
  const favs = S.favStores.map(f => c?.list.find(x => x.id === f.id) || f);
  $('#tab-stores').innerHTML = `
    <div class="card pad mt">
      <button class="btn pri full" id="locBtn">${ic('locate')} ${t('around')}</button>
      <div class="row mt"><input id="addrIn" placeholder="${t('addr_ph')}"><button class="btn" id="addrBtn" style="flex:none">${t('ok')}</button></div>
      <div class="row mt"><div class="seg" id="radSeg">${[1000, 2000, 5000, 10000].map(r => `<button data-r="${r}" class="${st.radius === r ? 'on' : ''}">${r / 1000} km</button>`).join('')}</div></div>
      <div class="seg mt" id="typeSeg"><button data-f="0" class="${!st.food ? 'on' : ''}">${t('supers')}</button><button data-f="1" class="${st.food ? 'on' : ''}">${t('food_shops')}</button></div>
    </div>
    <div id="map" style="${c ? '' : 'display:none'}"></div>
    ${favs.length ? `<div class="h2">${t('my_stores')}</div><div class="card">${listHtml(favs)}</div>` : ''}
    <div class="h2">${c ? t('n_stores', {n:c.list.length, w:esc(c.where === '@me' ? t('around_you') : c.where)}) : t('nearby')}</div>
    <div class="card">${c ? (listHtml(c.list.filter(s => !favIds.has(s.id))) || `<p class="pad muted">${t('no_other')}</p>`) : `<p class="pad muted small">${t('stores_help')}</p>`}</div>
    <p class="small muted" style="margin:10px 4px">${t('osm')}</p>`;
  $('#locBtn').onclick = locate;
  $('#addrBtn').onclick = geocode;
  $('#addrIn').onkeydown = e => { if (e.key === 'Enter') geocode(); };
  const redo = () => { if (S.storesCache) searchStores(S.storesCache.lat, S.storesCache.lon, S.storesCache.where); else renderStores(); };
  $$('#radSeg button').forEach(b => b.onclick = () => { S.settings.radius = +b.dataset.r; save(); redo(); });
  $$('#typeSeg button').forEach(b => b.onclick = () => { S.settings.food = b.dataset.f === '1'; save(); redo(); });
  $$('[data-fav]').forEach(b => b.onclick = () => toggleFav(b.dataset.fav));
  if (c) drawMap();
}
function toggleFav(id){
  const i = S.favStores.findIndex(s => s.id === id);
  if (i >= 0) S.favStores.splice(i, 1);
  else { const s = S.storesCache?.list.find(x => x.id === id); if (s) S.favStores.push({...s}); }
  save(); renderStores();
}
function locate(){
  if (!navigator.geolocation) return toast(t('geo_na'));
  $('#locBtn').textContent = t('locating');
  navigator.geolocation.getCurrentPosition(
    p => searchStores(p.coords.latitude, p.coords.longitude, '@me'),
    () => { toast(t('geo_refused')); renderStores(); },
    {enableHighAccuracy:true, timeout:12000, maximumAge:60000});
}
async function geocode(){
  const q = $('#addrIn').value.trim(); if (!q) return;
  try {
    const j = await (await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=${LANG}&q=${encodeURIComponent(q)}`)).json();
    if (!j.length) return toast(t('addr_nf'));
    searchStores(+j[0].lat, +j[0].lon, q);
  } catch(e){ toast(t('addr_err')); }
}
async function searchStores(lat, lon, where){
  const shops = S.settings.food ? 'supermarket|convenience|greengrocer|butcher|bakery|deli|seafood|frozen_food|department_store' : 'supermarket|department_store';
  const q = `[out:json][timeout:25];nwr["shop"~"^(${shops})$"](around:${S.settings.radius},${lat},${lon});out center tags 150;`;
  const btn = $('#locBtn'); if (btn) btn.textContent = t('searching_st');
  const eps = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter', 'https://overpass.private.coffee/api/interpreter'];
  let data = null;
  for (const ep of eps){
    try { const r = await fetch(ep, {method:'POST', body:'data=' + encodeURIComponent(q), headers:{'Content-Type':'application/x-www-form-urlencoded'}}); if (r.ok){ data = await r.json(); break; } } catch(e){}
  }
  if (!data){ toast(t('map_down')); renderStores(); return; }
  const list = data.elements.map(e => {
    const la = e.lat ?? e.center?.lat, lo = e.lon ?? e.center?.lon, g = e.tags || {};
    if (la == null) return null;
    return {id: e.type[0] + e.id, name: g.name || '', brand: g.brand || '', lat: la, lon: lo,
      addr: [[g['addr:street'], g['addr:housenumber']].filter(Boolean).join(' '), g['addr:city']].filter(Boolean).join(', '),
      hours: g.opening_hours || '', shop: g.shop, dist: hav(lat, lon, la, lo)};
  }).filter(s => s && (s.name || s.brand)).sort((a, b) => a.dist - b.dist);
  S.storesCache = {lat, lon, where, at: Date.now(), list};
  S.favStores.forEach(f => { const l = list.find(x => x.id === f.id); if (l) f.dist = l.dist; });
  save(); renderStores();
}
function drawMap(){
  const c = S.storesCache;
  if (!window.L){ setTimeout(drawMap, 400); return; }
  const el = $('#map'); if (!el) return;
  if (map){ map.remove(); map = null; }
  map = L.map(el, {zoomControl:false}).setView([c.lat, c.lon], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);
  L.circleMarker([c.lat, c.lon], {radius:8, color:'#fff', weight:3, fillColor:'#2a7de1', fillOpacity:1}).addTo(map);
  const pts = [[c.lat, c.lon]];
  c.list.forEach(s => {
    L.circleMarker([s.lat, s.lon], {radius:7, color:'#fff', weight:2, fillColor:brandColor(chainOf(s)), fillOpacity:1}).addTo(map)
      .bindPopup(`<b>${esc(storeLabel(s))}</b><br>${fmtDist(s.dist)}`)
      .on('click', () => { const card = document.querySelector(`[data-sid="${s.id}"]`); if (card) card.scrollIntoView({behavior:'smooth', block:'center'}); });
    pts.push([s.lat, s.lon]);
  });
  if (pts.length > 1) map.fitBounds(pts.slice(0, 15), {padding:[24, 24]});
  setTimeout(() => map && map.invalidateSize(), 150);
}

/* ================= Prix ================= */
let priceQ = '';
function renderPrices(){
  const byK = {};
  S.prices.forEach(r => { (byK[r.k] = byK[r.k] || []).push(r); });
  let rows = Object.entries(byK).map(([k, rs]) => { rs.sort((a, b) => b.d.localeCompare(a.d)); return {k, rs, last:rs[0]}; });
  if (priceQ){ const q = keyOf(priceQ); rows = rows.filter(r => keyOf(trName(r.last.n)).includes(q) || keyOf(r.last.n).includes(q)); }
  rows.sort((a, b) => b.last.d.localeCompare(a.last.d));
  $('#tab-prices').innerHTML = `
    <div class="row mt"><input id="pq" placeholder="${t('p_search')}" value="${esc(priceQ)}"><button class="btn pri" id="pAdd" style="flex:none">${ic('plus')} ${t('p_seen')}</button></div>
    ${rows.length ? `<div class="card mt">${rows.map(r => {
      const sameC = r.rs.filter(x => x.c === r.last.c && x.uu === r.last.uu);
      const prev = sameC[1]; let trend = '';
      if (prev){ const d = (r.last.up - prev.up) / prev.up * 100; if (Math.abs(d) >= 1) trend = `<span class="${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d).toFixed(0)} %</span>`; }
      const min = r.rs.filter(x => x.uu === r.last.uu).reduce((a, b) => b.up < a.up ? b : a, r.last);
      const chains = new Set(r.rs.map(x => x.c)).size;
      return `<button class="pr" data-k="${esc(r.k)}"><div class="bd2"><b>${esc(trName(r.last.n))}</b><div class="small muted">${esc(r.last.c)} · ${fdate(r.last.d)}${chains > 1 ? ' · ' + t('n_shops', {n:chains}) : ''}</div></div>
        <div class="v"><b>${eur(r.last.p)}</b><span class="small muted">${fmtUnit(r.last.up, r.last.uu)}</span>${trend ? `<div class="small">${trend}</div>` : ''}${min !== r.last ? `<div class="small down">${t('min')} ${fmtUnit(min.up, min.uu)} · ${esc(min.c)}</div>` : ''}</div></button>`;
    }).join('')}</div>` : `<div class="empty"><div class="big">📈</div><b>${t('p_empty_t')}</b>${t('p_empty_d')}</div>`}`;
  const pq = $('#pq');
  pq.oninput = () => { priceQ = pq.value; const pos = pq.selectionStart; renderPrices(); const n = $('#pq'); n.focus(); n.setSelectionRange(pos, pos); };
  $('#pAdd').onclick = () => openPriceForm();
  $$('.pr').forEach(b => b.onclick = () => openPriceDetail(b.dataset.k));
}
function spark(rs){
  const pts = rs.slice().reverse(); if (pts.length < 2) return '';
  const ys = pts.map(r => r.up), mn = Math.min(...ys), mx = Math.max(...ys), w = 300, h = 60;
  const xy = pts.map((r, i) => `${(i / (pts.length - 1) * (w - 10) + 5).toFixed(1)},${(h - 8 - (mx === mn ? .5 : (r.up - mn) / (mx - mn)) * (h - 16)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${xy}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
    <div class="row small muted" style="justify-content:space-between"><span>${fdate(pts[0].d)}</span><span>${t('min')} ${fmtUnit(mn, pts[0].uu)} · ${t('max')} ${fmtUnit(mx, pts[0].uu)}</span><span style="text-align:right">${fdate(pts[pts.length - 1].d)}</span></div>`;
}
function openPriceDetail(k){
  const rs = recordsOf(k); if (!rs.length) return;
  const name = trName(rs[0].n); const code = S.catalog[k]?.code;
  const sh = openSheet(`<h3>${esc(name)}</h3>
    <div class="card pad mt">${whereBlock(k)}${spark(rs.filter(r => r.uu === rs[0].uu))}</div>
    <div class="h2">${t('history')}</div>
    <div class="card pad"><table>${rs.slice(0, 20).map((r, i) => `<tr><td>${fdate(r.d)}<div class="small muted">${esc(r.s)}</div></td><td class="n">${eur(r.p)}<div class="small muted">${fmtUnit(r.up, r.uu)}</div></td><td style="width:40px"><button class="ib" data-del="${i}" style="width:34px;height:34px;color:var(--muted)">${ic('trash')}</button></td></tr>`).join('')}</table></div>
    ${code ? `<div class="h2">${t('community')}</div><div class="card pad" id="opRes2"><button class="btn sm" id="opBtn2">${t('load_op')}</button></div>` : ''}
    <div class="acts"><button class="btn pri" id="pdAdd">${ic('plus')} ${t('add_list')}</button></div>`);
  sh.querySelector('#pdAdd').onclick = () => { addItem(name); closeSheet(); toast(t('x_added', {x:name})); };
  $$('[data-del]', sh).forEach(b => b.onclick = () => {
    const r = rs[+b.dataset.del]; S.prices.splice(S.prices.indexOf(r), 1); save(); renderPrices();
    if (recordsOf(k).length) openPriceDetail(k); else closeSheet();

  const ob = sh.querySelector('#opBtn2'); if (ob) ob.onclick = () => openPrices(code, $('#opRes2'));
}

    <div class="grid2"><div><label class="f">${t('e_qty')}</label><input id="fQty" inputmode="decimal" placeholder="1"></div><div><label class="f">${t('e_unit')}</label>${unitSelect('')}</div></div>
    <p class="small muted">${t('pf_help')}</p>
    <div class="acts"><button class="btn ghost" id="pfX">${t('cancel')}</button><button class="btn pri" id="pfOk">${t('save')}</button></div>`);
  sh.querySelector('#pfX').onclick = () => closeSheet();
  sh.querySelector('#pfOk').onclick = () => {

    S.prices.push({k:canonK(n), n, s, c:s, p, q, u, up, uu, d:$('#pfD').value || today()});
    learn(n);

function renderTips(){
  const L = curList(); const items = L.items;
  const month = new Date().getMonth() + 1, mName = monthName(month);
  const an = items.length ? storeAnalysis(items) : null;
  const rem = reminders();
  const seasonal = SEASON.filter(s => s[2].includes(month)).map(s => LANG === 'es' ? s[1] : s[0]);
  const offSeason = items.filter(i => i.rayon === 'fl' && inSeason(i.name) === false);
  const near = c => { const all = [...S.favStores, ...(S.storesCache?.list || [])].filter(s => chainOf(s) === c && s.dist != null); return all.length ? Math.min(...all.map(s => s.dist)) : null; };
  let h = `<div class="h2">${t('t_where', {x:esc(L.name)})}</div><div class="card">`;
  if (!items.length) h += `<p class="pad muted">${t('t_empty')}</p>`;
  else if (!an) h += `<div class="tip"><span class="e">🧮</span><p>${t('t_nodata')}</p></div>`;
  else {
    const b = an.best; const d = near(b.c);
    h += `<div class="tip"><span class="e">🏆</span><p>${t('t_best', {c:esc(b.c), d: d != null ? t('t_at', {d:fmtDist(d)}) : ''})}<br><span class="small muted">${t('t_based', {a:b.cov, b:an.n})}</span></p></div>`;
    an.stats.forEach(s => { if (s === b) return; const pct = Math.round((s.idx / b.idx - 1) * 100); h += `<div class="tip"><span class="e" style="font-size:16px;width:22px;text-align:center">•</span><p>${t('t_avg', {c:esc(s.c), p: pct > 0 ? `+${pct} %` : pct < 0 ? `${pct} %` : t('t_equiv')})} <span class="small muted">${t('t_comp', {n:s.cov})}</span></p></div>`; });
    if (an.saving >= 2){
      const others = [...new Set(an.moves.map(m => m.cheap))];
      h += `<div class="tip"><span class="e">🔀</span><p>${t('t_split', {n:an.moves.length, c:esc(others.join(', ')), s:eur(an.saving)})}<br><span class="small muted">${an.moves.slice(0, 4).map(m => `${esc(m.name)} : ${fmtUnit(m.pm, m.uu)} vs ${fmtUnit(m.pb, m.uu)}`).join(' · ')}</span></p></div>`;
    }
  }
  h += `</div>`;
  if (rem.length) h += `<div class="h2">${t('t_rebuy')}</div><div class="card">${rem.slice(0, 6).map(r => `<div class="tip"><span class="e">⏰</span><p style="flex:1"><b>${esc(trName(r.name))}</b><br><span class="small muted">${t('t_rebuy_d', {a:r.avg, s:r.since})}</span></p><button class="btn sm" data-add="${esc(trName(r.name))}">${ic('plus')}</button></div>`).join('')}</div>`;
  if (offSeason.length) h += `<div class="h2">${t('t_inlist')}</div><div class="card">${offSeason.map(i => `<div class="tip"><span class="e">🌍</span><p>${t('t_off', {x:esc(dn(i)), m:mName})}</p></div>`).join('')}</div>`;
  h += `<div class="h2">${t('t_seas', {m:mName})}</div><div class="chips" style="flex-wrap:wrap;padding-top:0">${[...new Set(seasonal)].map(s => `<button class="chip" data-add="${esc(s)}">🍃 ${esc(s)}</button>`).join('')}</div>`;
  h += `<div class="h2">${t('t_cmp')}</div><div class="card pad"><div class="small muted">${t('t_cmp_d')}</div>
      ${[1, 2].map(n => `<div class="row mt"><input class="cp" id="cpP${n}" inputmode="decimal" placeholder="${t('t_price_n', {n})}"><input class="cp" id="cpQ${n}" inputmode="decimal" placeholder="${t('t_qty')}"><select class="cp" id="cpU${n}" style="flex:.8"><option value="g">g</option><option value="kg">kg</option><option value="ml">ml</option><option value="cl">cl</option><option value="l">L</option><option value="">${LANG === 'es' ? 'ud' : 'pce'}</option></select></div>`).join('')}
      <div id="cpRes"></div></div>`;
  if (S.settings.ai) h += `<div class="h2">${t('t_ai')}</div><div class="card pad"><button class="btn pri full" id="aiBtn">${t('t_ai_btn')}</button><div id="aiRes" class="mt"></div></div>`;
  h += `<div class="h2">${t('t_tips')}</div><div class="card">${TIPS.map(x => `<div class="tip"><span class="e">${x[0]}</span><p>${esc(LANG === 'es' ? x[2] : x[1])}</p></div>`).join('')}</div>`;
  $('#tab-tips').innerHTML = h;
  $$('.cp').forEach(i => i.oninput = compare);
  $$('#tab-tips [data-add]').forEach(b => b.onclick = () => { addItem(b.dataset.add); toast(t('x_added', {x:b.dataset.add})); renderTips(); });
  const ai = $('#aiBtn'); if (ai) ai.onclick = askAI;
}
function compare(){
  const v = n => { const p = num($('#cpP' + n).value), q = num($('#cpQ' + n).value), u = $('#cpU' + n).value; return p != null && q ? unitPrice(p, q, u) : null; };
  const a = v(1), b = v(2), out = $('#cpRes');
  if (!a || !b){ out.innerHTML = ''; return; }
  if (a.uu !== b.uu){ out.innerHTML = `<div class="res">${t('c_units')}</div>`; return; }
  if (Math.abs(a.up - b.up) < 0.005){ out.innerHTML = `<div class="res">${t('c_same', {x:fmtUnit(a.up, a.uu)})}</div>`; return; }
  const w = a.up < b.up ? 1 : 2, lo = Math.min(a.up, b.up), hi = Math.max(a.up, b.up);
  out.innerHTML = `<div class="res">${t('c_res', {w, p:Math.round((1 - lo / hi) * 100), a:fmtUnit(lo, a.uu), b:fmtUnit(hi, a.uu)})}</div>`;
}
async function askAI(){
  const L = curList(); const out = $('#aiRes');
  const payload = {
    demande: t('ai_ask'), langue: LANG, mois: monthName(new Date().getMonth() + 1),
    liste: L.items.map(i => ({nom:dn(i), quantite:qtyLabel(i), rayon:rn(i.rayon)})),
    prix_connus: L.items.map(i => ({nom:dn(i), prix:Object.values(recordsOf(i.k).reduce((m, r) => { if (!m[r.c]) m[r.c] = {magasin:r.c, prix:r.p, unite:fmtUnit(r.up, r.uu), date:r.d}; return m; }, {}))})).filter(x => x.prix.length)
  };
  out.innerHTML = `<p class="small muted">${t('ai_think')}</p>`;
  try {
    const r = await fetch(S.settings.ai, {method:'POST', body:JSON.stringify(payload)});
    const txt0 = await r.text(); let txt = txt0;

const GS_CODE = `// Cabas — partage en direct (Google Apps Script)
const SHEET = 'rooms';
function sh_(){ const ss = SpreadsheetApp.getActive(); return ss.getSheetByName(SHEET) || ss.insertSheet(SHEET); }
function row_(room){ const f = sh_().getRange('A:A').createTextFinder(room).matchEntireCell(true).findNext(); return f ? f.getRow() : 0; }
function read_(room){ const r = row_(room); return r ? JSON.parse(sh_().getRange(r, 2).getValue() || 'null') : null; }
function write_(room, doc){ const s = sh_(); let r = row_(room); if (!r){ r = s.getLastRow() + 1; s.getRange(r, 1).setValue(room); } s.getRange(r, 2, 1, 2).setValues([[JSON.stringify(doc), new Date()]]); }
function out_(o){ return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }
function doGet(e){
  const room = String(e.parameter.room || '').toUpperCase();
  if (!room) return out_({ok:true, app:'cabas'});
  const d = read_(room); return out_(d ? {ok:true, doc:d} : {ok:false, err:'notfound'});
}
function doPost(e){
  const b = JSON.parse(e.postData.contents); const room = String(b.room || '').toUpperCase();
  const lock = LockService.getScriptLock(); lock.waitLock(15000);
  try {
    let d = read_(room);
    if (!d){ if (!b.create) return out_({ok:false, err:'notfound'}); d = {name:'', budget:0, u:0, items:{}, log:[], v:0}; }
    if (b.meta && (b.meta.u || 0) > (d.u || 0)){ d.name = b.meta.name; d.budget = b.meta.budget; d.u = b.meta.u; }
    (b.items || []).forEach(it => { const c = d.items[it.id]; if (!c || (it.u || 0) > (c.u || 0)) d.items[it.id] = it; });
    (b.log || []).forEach(l => d.log.push(l)); d.log = d.log.slice(-80);
    const lim = Date.now() - 30 * 864e5;
    Object.keys(d.items).forEach(k => { if (d.items[k].del && d.items[k].u < lim) delete d.items[k]; });
    d.v++; write_(room, d);
    return out_({ok:true, doc:d});
  } finally { lock.releaseLock(); }
}`;

    const gone = L.gone.filter(g => g.dirty);

    let res;
    if (mode === 'create' || dirty.length || gone.length || logs.length || L.metaDirty){
      const body = {room:L.shared.room, create: mode === 'create', meta:{name:L.name, budget:L.budget || 0, u:L.mu || 0}, items:[...dirty.map(([i]) => strip(i)), ...gone.map(strip)], log:logs};
      res = await (await fetch(url, {method:'POST', body:JSON.stringify(body)})).json();

let tessP = null, tessW = null;
function loadTess(){
  if (window.Tesseract) return Promise.resolve();
  if (tessP) return tessP;
  tessP = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'; s.onload = res; s.onerror = () => { tessP = null; rej(new Error('load')); }; document.head.appendChild(s); });
  return tessP;
}
async function ocrWorker(){
  await loadTess();
  if (!tessW) tessW = await Tesseract.createWorker('spa');
  return tessW;
}
function grabFrame(v){
  const w = v.videoWidth, h = v.videoHeight;
  const cw = Math.round(w * .92), ch = Math.round(h * .7), sx = Math.round((w - cw) / 2), sy = Math.round((h - ch) / 2);
  const scale = Math.min(2, 1600 / cw);
  const c = document.createElement('canvas'); c.width = Math.round(cw * scale); c.height = Math.round(ch * scale);
  const x = c.getContext('2d'); x.drawImage(v, sx, sy, cw, ch, 0, 0, c.width, c.height);
  const d = x.getImageData(0, 0, c.width, c.height), a = d.data;
  let mn = 255, mx = 0;
  for (let i = 0; i < a.length; i += 4){ const g = a[i] * .3 + a[i+1] * .59 + a[i+2] * .11; a[i] = g; if (g < mn) mn = g; if (g > mx) mx = g; }
  const k = 255 / Math.max(1, mx - mn);
  for (let i = 0; i < a.length; i += 4){ const g = (a[i] - mn) * k; a[i] = a[i+1] = a[i+2] = g; }
  x.putImageData(d, 0, 0);
  return c;
}
const LABEL_STOP = /^(precio|pvp|p\.v\.p|eur|euros?|iva|oferta|promo|ahorra|ahorro|unidad|ud|kg|kilo|litro|l|cada|antes|ahora|el kg|el litro|por|de|ref|cod|codigo)$/i;
function parseLabel(text){
  const lines = text.split('\n').map(s => s.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const prices = []; const seen = new Set();
  lines.forEach(l => {
    const unit = /\/\s*(kg|k|l|lt|litro|kilo|ud|u)\b|€\s*\/|\b(por|el|precio)\s*(kg|kilo|litro|l)\b/i.test(l);
    const re = /(\d{1,3})\s?[,.'´`]\s?(\d{2})(?!\d)/g; let m;
    while ((m = re.exec(l))){ const v = parseFloat(m[1] + '.' + m[2]); if (v > 0 && v < 1000 && !seen.has(v + '|' + unit)){ seen.add(v + '|' + unit); prices.push({v, unit}); } }
  });
  let qty = null, unitQ = '';
  const qm = text.match(/(\d+(?:[.,]\d+)?)\s?(kg|g|gr|grs|ml|cl|l|lt|litros?)\b/i);
  if (qm){ qty = num(qm[1]); unitQ = qm[2].toLowerCase().replace(/^(gr|grs)$/, 'g').replace(/^(lt|litros?)$/, 'l'); }
  const name = lines.filter(l => { const letters = (l.match(/[a-záéíóúñü]/gi) || []).length; return letters >= 4 && letters / l.length > .7 && !/\d\s?[,.'´`]\s?\d{2}/.test(l) && !/€/.test(l); })
    .map(l => l.split(' ').filter(w => !LABEL_STOP.test(w)).join(' ')).filter(l => l.length >= 4).slice(0, 2).join(' ');
  const main = prices.find(p => !p.unit) || prices[0] || null;
  return {prices, main, qty, unit:unitQ, name: name ? cap(name.toLowerCase()) : ''};
}

    const cam = $('.cam.lbl'); if (cam) cam.style.display = 'none';
  }
  loadTess().catch(() => {});
}

/* ================= Navigation & évènements ================= */
const TABS = {list:'list', stores:'pin', prices:'chart', tips:'bulb', more:'more'};
function applyStatic(){
  $$('#nav button').forEach(b => { b.innerHTML = ic(TABS[b.dataset.tab]) + t('tab_' + b.dataset.tab); });
  $('#addIn').placeholder = t('add_ph');
  $('#storeBtn').setAttribute('aria-label', t('a_store'));
  $('#shareBtn').setAttribute('aria-label', t('a_send'));
  $('#syncBtn').setAttribute('aria-label', t('a_sync'));
  $('#micBtn').setAttribute('aria-label', t('a_mic'));
  $('#scanBtn').setAttribute('aria-label', t('a_scan'));
}
function showTab(tb){
  $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tb));
  $$('.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + tb));
  $('#listActs').style.visibility = tb === 'list' ? 'visible' : 'hidden';
  $('#titleChev').style.display = tb === 'list' ? '' : 'none';
  $('#title').textContent = tb === 'list' ? curList().name : t('tab_' + tb);
  if (tb === 'list') renderList();
  if (tb === 'stores') renderStores();
  if (tb === 'prices') renderPrices();
  if (tb === 'tips') renderTips();
  if (tb === 'more') renderMore();
  window.scrollTo(0, 0);
}
function renderAll(){ showTab($$('#nav button').find(b => b.classList.contains('on')).dataset.tab); }
$$('#nav button').forEach(b => b.onclick = () => showTab(b.dataset.tab));

$('#storeBtn').innerHTML = ic('cart');
$('#shareBtn').innerHTML = ic('share');
$('#syncBtn').innerHTML = ic('users');
$('#micBtn').innerHTML = ic('mic');
$('#scanBtn').innerHTML = ic('scan');
if (!SR) $('#micBtn').style.display = 'none';
$('#storeBtn').onclick = () => { if (S.trip){ if (!S.trip.lines.length || confirm(t('trip_end_c'))) endTrip(); } else startTrip(); };
$('#shareBtn').onclick = openShare;
$('#syncBtn').onclick = openActivity;
$('#micBtn').onclick = toggleMic;
$('#scanBtn').onclick = openScan;
$('#titleBtn').onclick = () => { if ($('#tab-list').classList.contains('on')) openListPicker(); };

/* Autocomplétion : historique + catalogue de départ */
const addIn = $('#addIn'), ac = $('#ac');
function renderAC(){
  const raw = addIn.value.trim();
  if (!raw){ ac.classList.remove('on'); return; }
  const p = parseInput(raw); const pk = keyOf(p.name); if (!pk){ ac.classList.remove('on'); return; }
  const pre = p.qty ? p.qty + (p.unit ? ' ' + p.unit : '') + ' ' : '';
  const seen = new Set([canonK(p.name)]);
  const out = [];
  Object.entries(S.catalog).sort((a, b) => (b[1].b * 3 + b[1].n) - (a[1].b * 3 + a[1].n)).forEach(([k, c]) => {
    if (out.length >= 3 || seen.has(k)) return;
    const nm = trName(c.name);
    if (keyOf(nm).includes(pk) || keyOf(c.name).includes(pk)){ seen.add(k); out.push({name:nm, r:c.rayon || guessRayon(c.name), hint: c.b ? '×' + c.b : ''}); }
  });
  SEED.forEach(s => {
    if (out.length >= 6 || seen.has(s.k)) return;
    const own = keyOf(s[LANG]);
    if (own.startsWith(pk) || own.includes(' ' + pk) || (pk.length > 2 && (s.nf.includes(pk) || s.ne.includes(pk)))){ seen.add(s.k); out.push({name:s[LANG], r:s.r, hint:''}); }
  });
  const ray = RAY[guessRayon(p.name)];
  let h = `<button data-ac="${esc(raw)}"><span>${ray.e}</span><span><b>${esc(p.name)}</b>${qtyLabel(p) ? ' · ' + esc(qtyLabel(p)) : ''}</span><em>${rn(ray.id)}</em></button>`;
  h += out.map(o => `<button data-ac="${esc(pre + o.name)}"><span>${RAY[o.r].e}</span><span>${esc(o.name)}</span><em>${esc(o.hint || rn(o.r))}</em></button>`).join('');
  ac.innerHTML = h; ac.classList.add('on');
}
addIn.oninput = renderAC;
addIn.onkeydown = e => { if (e.key === 'Enter' && addIn.value.trim()){ addItem(addIn.value); addIn.value = ''; ac.classList.remove('on'); } };
addIn.onblur = () => setTimeout(() => ac.classList.remove('on'), 150);
ac.addEventListener('pointerdown', e => e.preventDefault());
ac.onclick = e => { const b = e.target.closest('[data-ac]'); if (!b) return; addItem(b.dataset.ac); addIn.value = ''; ac.classList.remove('on'); addIn.focus(); };
$('#chips').onclick = e => { const b = e.target.closest('[data-add]'); if (b) addItem(b.dataset.add); };

$('#list').addEventListener('click', e => {
  const b = e.target.closest('[data-readd]'); if (!b) return;
  const r = (S.recent || []).find(x => x.k === b.dataset.readd); if (!r) return;
  addItem('', {name:trName(r.name), qty:r.qty, unit:r.unit, rayon:r.rayon});
});
$('#list').onclick = e => {
  const a = e.target.closest('[data-a]'); if (!a) return;
  const act = a.dataset.a;
  if (act === 'toggleRecent'){ showRecent = !showRecent; renderList(); return; }
  const L = curList(); const id = (a.closest('.item') || a.closest('.citem'))?.dataset.id; const it = L.items.find(i => i.id === id); if (!it) return;
  if (act === 'take'){
    if (lpFired){ lpFired = false; return; }
    if (a.classList.contains('gone')) return;
    a.classList.add('gone'); vib(12);
    setTimeout(() => { takeItem(L, it); if (S.trip) askPrice(it); }, 260);
    return;
  }
  if (act === 'chk'){ vib(12); a.closest('.item').classList.add('done'); setTimeout(() => { takeItem(L, it); if (S.trip) askPrice(it); }, 260); }
  if (act === 'edit') editItem(id);
};

/* Appui long sur une ligne du carnet : modifier */
let lpTimer = null, lpFired = false, lpXY = null;
$('#list').addEventListener('pointerdown', e => {
  const r = e.target.closest('.citem'); if (!r) return;
  lpFired = false; lpXY = [e.clientX, e.clientY];
  lpTimer = setTimeout(() => { lpFired = true; vib(25); editItem(r.dataset.id); }, 520);
});
const lpCancel = () => clearTimeout(lpTimer);
$('#list').addEventListener('pointerup', lpCancel);
$('#list').addEventListener('pointercancel', lpCancel);
$('#list').addEventListener('pointermove', e => { if (lpXY && Math.hypot(e.clientX - lpXY[0], e.clientY - lpXY[1]) > 10) lpCancel(); });
$('#list').addEventListener('contextmenu', e => { if (e.target.closest('.citem')) e.preventDefault(); });

function applyTheme(){
  const th = S.settings.theme;
  if (th === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = th;
  const dark = th === 'dark' || (th === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelector('meta[name=theme-color]').content = dark ? '#1d1917' : '#fbf7f3';
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);

applyTheme();
applyStatic();
if (S.settings.storeMode || S.trip) setStoreMode(!!S.trip);
renderList();
handleInvite();
if (curList().shared) syncList(curList());
if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  const hadCtrl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('./sw.js').then(reg => {
    reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadCtrl || $('.upd')) return;
    const d = document.createElement('div'); d.className = 'upd';
    d.innerHTML = `<span>✨ ${t('upd')}</span><button class="btn pri sm">${t('upd_btn')}</button>`;
    d.querySelector('button').onclick = () => location.reload();
    document.body.appendChild(d);
  });
}
</script>
